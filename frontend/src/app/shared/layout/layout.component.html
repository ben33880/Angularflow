<div class="flex min-h-screen bg-slate-50 dark:bg-slate-900">
  <!-- Sidebar -->
  <aside class="w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 fixed h-screen overflow-y-auto custom-scrollbar transition-all">
    <!-- Header -->
    <div class="p-6 border-b border-slate-200 dark:border-slate-700 bg-gradient-to-br from-white to-slate-50 dark:from-slate-800 dark:to-slate-900">
      <h1 class="text-2xl font-bold text-gradient mb-3">Flow.io</h1>
      <div 
        class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold transition-all"
        [ngClass]="mqttConnected() ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-400'"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse-slow"></span>
        {{ mqttConnected() ? 'Connecté' : 'Déconnecté' }}
      </div>
    </div>

    <!-- Navigation -->
    <nav class="p-4 flex-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white transition-all mb-1 font-medium relative overflow-hidden group"
        >
          <span class="text-xl group-hover:scale-110 transition-transform">{{ item.icon }}</span>
          <span class="z-10">{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex items-center justify-between gap-3">
      <div class="mqtt-info" *ngIf="isConfigured()">
        <small class="text-xs text-slate-500 dark:text-slate-400 font-mono bg-slate-200 dark:bg-slate-700 px-2 py-1 rounded border border-slate-300 dark:border-slate-600">
          {{ mqttConfig().broker }}:{{ mqttConfig().port }}
        </small>
      </div>
      <button 
        class="settings-btn w-10 h-10 flex items-center justify-center text-lg rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all hover:rotate-30"
        (click)="openSettings()" 
        title="Configuration MQTT"
      >
        ⚙️
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 ml-72 p-8 overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-900 min-h-screen">
    <router-outlet></router-outlet>
  </main>
</div>
