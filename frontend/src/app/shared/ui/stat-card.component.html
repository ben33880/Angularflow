<div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-5 shadow-sm hover:shadow-lg hover:-translate-y-1 transition-all relative overflow-hidden group">
  <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-primary-500 to-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
  
  <div class="flex items-center justify-between mb-4">
    <div class="w-12 h-12 flex items-center justify-center bg-gradient-to-br from-primary-100 to-cyan-100 dark:from-primary-900/30 dark:to-cyan-900/30 rounded-lg text-2xl group-hover:scale-110 group-hover:rotate-6 transition-all">
      {{ icon }}
    </div>
  </div>
  
  <div class="text-3xl font-bold text-slate-900 dark:text-white mb-2 tracking-tight">{{ value }}</div>
  <div class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wide">{{ label }}</div>
  
  <div class="mt-4">
    <ng-content></ng-content>
  </div>
</div>
