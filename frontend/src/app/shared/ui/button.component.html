<button
  class="inline-flex items-center justify-center gap-2 px-5 py-3 font-semibold rounded-lg transition-all whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed active:scale-95"
  [ngClass]="{
    'bg-gradient-to-r from-primary-500 to-primary-600 text-white shadow-lg shadow-primary-500/30 hover:shadow-xl hover:-translate-y-0.5': variant === 'primary',
    'bg-slate-100 dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600': variant === 'secondary',
    'bg-gradient-to-r from-red-500 to-red-600 text-white shadow-lg shadow-red-500/30 hover:shadow-xl hover:-translate-y-0.5': variant === 'danger',
    'bg-transparent text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700': variant === 'ghost'
  }"
  [disabled]="disabled"
>
  <ng-content></ng-content>
</button>
