<div class="setup-container">
  <app-card>
    <h1>Configuration MQTT</h1>
    <p class="subtitle">Configurez la connexion au broker MQTT pour contrôler votre Flow.io</p>

    <div class="form-group">
      <label for="broker">Broker MQTT</label>
      <app-input
        id="broker"
        type="text"
        [value]="broker()"
        (valueChange)="broker.set($event)"
        placeholder="192.168.1.100"
        [required]="true"
      />
      <small>Adresse IP ou hostname du broker (ex: 192.168.1.100)</small>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="port">Port</label>
        <app-input
          id="port"
          type="number"
          [value]="port()"
          (valueChange)="port.set($event)"
          placeholder="1883"
          [required]="true"
        />
      </div>

      <div class="form-group">
        <label for="path">Path WebSocket</label>
        <app-input
          id="path"
          type="text"
          [value]="path()"
          (valueChange)="path.set($event)"
          placeholder="/mqtt"
          [required]="true"
        />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="username">Username (optionnel)</label>
        <app-input
          id="username"
          type="text"
          [value]="username()"
          (valueChange)="username.set($event)"
          placeholder="mqtt_user"
        />
      </div>

      <div class="form-group">
        <label for="password">Password (optionnel)</label>
        <app-input
          id="password"
          type="password"
          [value]="password()"
          (valueChange)="password.set($event)"
          placeholder="••••••••"
        />
      </div>
    </div>

    <div class="actions">
      <app-button
        variant="primary"
        (click)="saveAndConnect()"
        [disabled]="connecting() || !broker()"
      >
        {{ connecting() ? 'Connexion...' : 'Sauvegarder & Connecter' }}
      </app-button>

      <app-button
        variant="secondary"
        (click)="skip()"
      >
        Passer pour l'instant
      </app-button>
    </div>

    <div *ngIf="error()" class="error-message">
      {{ error() }}
    </div>

    <div *ngIf="success()" class="success-message">
      ✓ Connecté avec succès ! Redirection...
    </div>
  </app-card>
</div>
