<div class="page-header fade-in">
  <h1 class="page-title">⚙️ Configuration</h1>
  <p class="page-subtitle">Paramè¬®tres ré­seau et MQTT de votre contrôleur</p>
</div>

<flow-card title="🌐 Ré­seau & MQTT" class="fade-in">
  <div class="config-form" *ngIf="config(); else loadingTpl">
    <div class="form-section">
      <h3 class="section-title">📡 Wi‑Fi</h3>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">📶</span>
            SSID Wi‑Fi
          </label>
          <input type="text" class="form-input" 
                 [ngModel]="config()!.wifiSsid"
                 (ngModelChange)="configSignal.update(c => c ? {...c, wifiSsid: $event} : c)" 
                 placeholder="Nom du ré­seau Wi‑Fi" />
        </div>

        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">🔑</span>
            Mot de passe Wi‑Fi
          </label>
          <input type="password" class="form-input" 
                 [ngModel]="config()!.wifiPassword ?? ''"
                 (ngModelChange)="configSignal.update(c => c ? {...c, wifiPassword: $event} : c)" 
                 placeholder="••••••••" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h3 class="section-title">📨 MQTT</h3>
      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" class="checkbox-input" 
                 [ngModel]="config()!.mqttEnabled"
                 (ngModelChange)="configSignal.update(c => c ? {...c, mqttEnabled: $event} : c)" />
          <span class="checkbox-text">Activer MQTT</span>
        </label>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">🖥️</span>
            Broker MQTT
          </label>
          <input type="text" class="form-input" 
                 [ngModel]="config()!.mqttBroker"
                 (ngModelChange)="configSignal.update(c => c ? {...c, mqttBroker: $event} : c)" 
                 placeholder="mqtt://broker.local:1883" />
        </div>

        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">👤</span>
            Username MQTT
          </label>
          <input type="text" class="form-input" 
                 [ngModel]="config()!.mqttUsername ?? ''"
                 (ngModelChange)="configSignal.update(c => c ? {...c, mqttUsername: $event} : c)" 
                 placeholder="username" />
        </div>

        <div class="form-group">
          <label class="form-label">
            <span class="label-icon">🔐</span>
            Password MQTT
          </label>
          <input type="password" class="form-input" 
                 [ngModel]="config()!.mqttPassword ?? ''"
                 (ngModelChange)="configSignal.update(c => c ? {...c, mqttPassword: $event} : c)" 
                 placeholder="••••••••" />
        </div>
      </div>
    </div>

    <div class="form-actions">
      <flow-button variant="primary" (clicked)="save()">
        <span>💾</span>
        Enregistrer
      </flow-button>
      <flow-button (clicked)="load()">
        <span>🔄</span>
        Recharger
      </flow-button>
    </div>

    <div class="success-msg" *ngIf="saved()">
      <span class="success-icon">✅</span>
      Configuration enregistré­e avec succès
    </div>
  </div>

  <ng-template #loadingTpl>
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Chargement de la configuration…</p>
    </div>
  </ng-template>
</flow-card>

<div class="error-msg" *ngIf="error()">
  <span class="error-icon">⚠️</span>
  <span>{{ error() }}</span>
</div>
