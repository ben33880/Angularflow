<div class="page-header fade-in">
  <h1 class="page-title">📋 Journaux</h1>
  <p class="page-subtitle">Historique des événements du système</p>
</div>

<flow-card title="📜 Logs système" class="fade-in">
  <div class="logs-header">
    <div class="logs-info">
      <span class="logs-count">{{ logs().length }} entrées</span>
      <span class="logs-hint">Derniers événements du contrôleur</span>
    </div>
    <flow-button variant="primary" (clicked)="load()">
      <span>🔄</span>
      Rafraîchir
    </flow-button>
  </div>

  <div class="logs-list" *ngIf="logs().length > 0; else emptyTpl">
    <div class="log-row" *ngFor="let log of logs()">
      <div class="log-header">
        <div class="log-meta">
          <span class="log-time">{{ log.timestamp | date:'dd/MM/yyyy HH:mm:ss' }}</span>
          <span class="log-level" [class]="levelClass(log.level)">
            <span class="level-dot"></span>
            {{ log.level }}
          </span>
          <span class="log-module" *ngIf="log.module">{{ log.module }}</span>
        </div>
      </div>
      <div class="log-message">{{ log.message }}</div>
    </div>
  </div>

  <ng-template #emptyTpl>
    <div class="empty-state">
      <div class="empty-icon">📭</div>
      <p>Aucun log disponible</p>
    </div>
  </ng-template>
</flow-card>

<div class="error-msg" *ngIf="error()">
  <span class="error-icon">⚠️</span>
  <span>{{ error() }}</span>
</div>
