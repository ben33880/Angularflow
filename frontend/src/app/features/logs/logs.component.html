<div class="space-y-8">
  <div>
    <h1 class="text-4xl font-bold text-gradient mb-2">📋 Logs</h1>
    <p class="text-dark-400">Journaux systè¬®me</p>
  </div>

  <flow-card title="📜 Journaux">
    <div class="flex items-center justify-between mb-6">
      <span class="text-dark-400">{{ logs().length }} entré¬°es</span>
      <flow-button variant="primary" (clicked)="load()">
        🔄 Rafraî®®chir
      </flow-button>
    </div>

    <div class="space-y-3 max-h-[60vh] overflow-auto pr-2" *ngIf="logs().length > 0; else emptyTpl">
      <div class="p-4 glass rounded-xl border border-dark-700/50" *ngFor="let log of logs()">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-xs text-dark-500">{{ log.timestamp | date:'medium' }}</span>
          <span class="badge" 
                [class.badge-info]="log.level === 'INFO'"
                [class.badge-warning]="log.level === 'WARN'"
                [class.badge-error]="log.level === 'ERROR'">
            {{ log.level }}
          </span>
          <span class="text-xs text-dark-400 font-mono" *ngIf="log.module">{{ log.module }}</span>
        </div>
        <div class="text-dark-200 text-sm">{{ log.message }}</div>
      </div>
    </div>

    <ng-template #emptyTpl>
      <div class="flex flex-col items-center justify-center py-12 text-dark-400">
        <span class="text-4xl mb-4">📄</span>
        <p>Aucun log</p>
      </div>
    </ng-template>
  </flow-card>

  <div class="p-4 glass rounded-xl border border-red-500/30" *ngIf="error()">
    <div class="flex items-center gap-3">
      <span class="text-xl">⚠️</span>
      <span class="text-red-300">{{ error() }}</span>
    </div>
  </div>
</div>
