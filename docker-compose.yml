version: '3.8'

services:
  angularflow:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile
    container_name: angularflow
    ports:
      - "4200:80"
    restart: unless-stopped
    networks:
      - angularflow-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  angularflow-network:
    driver: bridge
